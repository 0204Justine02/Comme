<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Comme Messenger</title> <style> /* ========================= MIDNIGHT VIOLET THEME ========================= */ :root { --primary: #7c3aed; --primary-dark: #5b21b6; --secondary: #a855f7; --accent: #c084fc; --dark: #0f0b1a; --dark-card: #181329; --dark-input: #241b38; --light: #f8f7fc; --received: #ede9fe; --text: #171321; --muted: #8b8499; --border: #e5e1ed; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; } body { background: var(--light); color: var(--text); } button, input { font-family: inherit; } /* ========================= AUTH PAGE ========================= */ .auth-page { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: radial-gradient( circle at top left, rgba(192, 132, 252, .35), transparent 35% ), linear-gradient( 135deg, #0f0b1a, #24113f, #5b21b6 ); } .auth-box { width: 400px; max-width: 100%; padding: 40px 35px; background: rgba(24, 19, 41, .95); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; box-shadow: 0 25px 70px rgba(0,0,0,.45); text-align: center; color: white; } .logo { color: var(--accent); font-size: 42px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; } .logo-subtitle { color: #a9a0b9; font-size: 14px; margin-bottom: 30px; } .auth-box h2 { margin-bottom: 20px; font-size: 25px; } .auth-box input { width: 100%; padding: 14px 16px; margin: 7px 0; border: 1px solid #392d52; border-radius: 12px; background: var(--dark-input); color: white; outline: none; font-size: 15px; transition: .2s; } .auth-box input::placeholder { color: #8e849d; } .auth-box input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(168,85,247,.15); } .main-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 12px; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 25px rgba(124,58,237,.3); transition: .2s; } .main-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(124,58,237,.45); } .switch-btn { margin-top: 20px; border: none; background: none; color: var(--accent); cursor: pointer; font-size: 14px; } .switch-btn:hover { color: white; } .error { color: #ff7b7b; margin-top: 12px; font-size: 14px; } /* ========================= APP ========================= */ #app { display: none; height: 100vh; } .messenger { height: 100vh; display: flex; background: white; } /* ========================= SIDEBAR ========================= */ .sidebar { width: 330px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; } .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; } .sidebar-header h2 { font-size: 27px; color: var(--primary-dark); } .logout { border: none; background: #f1eef7; color: #5c536b; padding: 8px 12px; border-radius: 9px; cursor: pointer; } .logout:hover { background: #e8e1f2; } /* ========================= PROFILE MINI ========================= */ .profile-mini { padding: 8px 15px 18px; display: flex; align-items: center; cursor: pointer; } .profile-mini-name { font-weight: bold; } .profile-mini-email { color: var(--muted); font-size: 12px; margin-top: 3px; } /* ========================= AVATAR ========================= */ .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; object-fit: cover; background-size: cover; background-position: center; } /* ========================= SEARCH ========================= */ .search { width: calc(100% - 30px); margin: 0 15px 15px; padding: 12px 16px; border: none; background: #f3f1f7; border-radius: 20px; outline: none; color: var(--text); } .search:focus { box-shadow: 0 0 0 2px rgba(124,58,237,.15); } /* ========================= USERS ========================= */ .users { overflow-y: auto; flex: 1; } .user { display: flex; align-items: center; padding: 12px 15px; cursor: pointer; transition: .15s; } .user:hover { background: #f6f3fb; } .user.active { background: #eee7ff; } .user.active .avatar { box-shadow: 0 0 0 3px rgba(124,58,237,.15); } .user-info { min-width: 0; } .user-info strong { display: block; margin-bottom: 4px; } .user-info span { color: var(--muted); font-size: 13px; } /* ========================= CHAT ========================= */ .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--light); } .empty-chat { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; color: var(--muted); } .empty-chat h2 { color: var(--primary-dark); margin-bottom: 8px; } .chat-area { height: 100%; display: flex; flex-direction: column; } /* ========================= CHAT HEADER ========================= */ .chat-header { height: 75px; padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; background: white; } .chat-header .avatar { width: 42px; height: 42px; } .chat-header-info strong { display: block; } .chat-header-info span { color: var(--muted); font-size: 13px; } /* ========================= MESSAGES ========================= */ .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: radial-gradient( circle at 10% 10%, rgba(192,132,252,.08), transparent 25% ), var(--light); } .message { max-width: 65%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; line-height: 1.4; } .received { background: var(--received); color: var(--text); align-self: flex-start; border-bottom-left-radius: 5px; } .sent { background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; align-self: flex-end; border-bottom-right-radius: 5px; box-shadow: 0 3px 10px rgba(124,58,237,.18); } .message-time { font-size: 10px; opacity: .65; margin-top: 3px; } /* ========================= MESSAGE INPUT ========================= */ .message-input { display: flex; padding: 15px; border-top: 1px solid var(--border); gap: 10px; background: white; } .message-input input { flex: 1; padding: 13px 16px; border: none; background: #f1eef7; border-radius: 22px; outline: none; font-size: 15px; } .message-input input:focus { box-shadow: 0 0 0 2px rgba(124,58,237,.15); } .message-input button { width: 45px; height: 45px; border: none; border-radius: 50%; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; cursor: pointer; font-size: 18px; transition: .2s; } .message-input button:hover { transform: scale(1.05); } /* ========================= PROFILE MODAL ========================= */ .modal { display: none; position: fixed; inset: 0; background: rgba(15,11,26,.65); justify-content: center; align-items: center; z-index: 100; padding: 20px; } .modal-box { width: 380px; max-width: 100%; background: white; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); } .modal-box h2 { margin-bottom: 20px; color: var(--primary-dark); } .profile-large { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; font-weight: bold; background-size: cover; background-position: center; } .file-label { display: inline-block; background: var(--primary); color: white; padding: 10px 15px; border-radius: 9px; cursor: pointer; margin-bottom: 15px; } .file-label:hover { background: var(--primary-dark); } #profileFile { display: none; } .close-btn { border: none; background: #eeeaf3; padding: 10px 18px; border-radius: 8px; cursor: pointer; } /* ========================= MOBILE ========================= */ @media (max-width: 700px) { .sidebar { width: 82px; } .sidebar-header h2, .search, .user-info, .logout, .profile-mini-name, .profile-mini-email { display: none; } .sidebar-header { justify-content: center; } .profile-mini { justify-content: center; } .user { justify-content: center; } .avatar { margin-right: 0; } .message { max-width: 80%; } } </style> </head> <body> <!-- ========================= LOGIN ========================= --> <div id="loginPage" class="auth-page"> <div class="auth-box"> <div class="logo">Comme</div> <div class="logo-subtitle"> Connect. Chat. Stay Comme. </div> <h2>Welcome Back</h2> <input type="email" id="loginEmail" placeholder="Email" > <input type="password" id="loginPassword" placeholder="Password" > <button class="main-btn" id="loginBtn" > Log In </button> <p id="loginError" class="error" ></p> <button class="switch-btn" id="showRegisterBtn" > Create Account </button> </div> </div> <!-- ========================= CREATE ACCOUNT ========================= --> <div id="registerPage" class="auth-page" style="display:none;" > <div class="auth-box"> <div class="logo">Comme</div> <div class="logo-subtitle"> Join the conversation. </div> <h2>Create Account</h2> <input type="text" id="registerUsername" placeholder="Nickname" > <input type="email" id="registerEmail" placeholder="Email" > <input type="password" id="registerPassword" placeholder="Password" > <input type="password" id="confirmPassword" placeholder="Confirm password" > <button class="main-btn" id="registerBtn" > Create Account </button> <p id="registerError" class="error" ></p> <button class="switch-btn" id="showLoginBtn" > Already have an account? Log In </button> </div> </div> <!-- ========================= MAIN APPLICATION ========================= --> <div id="app"> <div class="messenger"> <!-- SIDEBAR --> <aside class="sidebar"> <div class="sidebar-header"> <h2>Comme</h2> <button class="logout" id="logoutBtn" > Logout </button> </div> <!-- MY PROFILE --> <div class="profile-mini" id="profileButton" > <div class="avatar" id="myAvatar" ></div> <div> <div class="profile-mini-name" id="myUsername" ></div> <div class="profile-mini-email" id="myEmail" ></div> </div> </div> <!-- SEARCH --> <input class="search" id="searchInput" placeholder="Search users..." > <!-- USERS --> <div class="users" id="users" ></div> </aside> <!-- CHAT --> <main class="chat"> <!-- EMPTY CHAT --> <div id="emptyChat" class="empty-chat" > <div> <h2>Welcome to Comme</h2> <p> Select someone to start chatting. </p> </div> </div> <!-- CHAT AREA --> <div id="chatArea" class="chat-area" style="display:none;" > <!-- CHAT HEADER --> <div class="chat-header"> <div class="avatar" id="chatAvatar" ></div> <div class="chat-header-info"> <strong id="chatName"></strong> <span> Messenger </span> </div> </div> <!-- MESSAGES --> <div class="messages" id="messages" ></div> <!-- MESSAGE INPUT --> <div class="message-input"> <input id="messageInput" placeholder="Type a message..." > <button id="sendBtn"> ➤ </button> </div> </div> </main> </div> </div> <!-- ========================= PROFILE MODAL ========================= --> <div class="modal" id="profileModal" > <div class="modal-box"> <h2>Your Profile</h2> <div id="profilePreview" class="profile-large" ></div> <label class="file-label" for="profileFile" > Choose Profile Picture </label> <input type="file" id="profileFile" accept="image/*" > <p id="profileStatus" style="margin-bottom:15px;color:#777;" ></p> <button class="close-btn" id="closeProfile" > Close </button> </div> </div> <!-- ========================= FIREBASE / APPLICATION JS ========================= --> <script type="module"> /* * Keep your existing Firebase imports, * Firebase configuration, authentication, * Firestore messaging, profile upload, * search, and logout JavaScript here. * * The IDs above intentionally remain the * same as your existing JavaScript so the * Firebase functionality can continue working. */ </script> </body> </html>
