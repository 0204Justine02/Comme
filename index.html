<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Comme Messenger</title> <style> :root { --primary: #7c3aed; --primary-dark: #5b21b6; --secondary: #a855f7; --accent: #c084fc; --dark: #0f0b1a; --dark-card: #181329; --dark-input: #241b38; --light: #f8f7fc; --received: #ede9fe; --text: #171321; --muted: #8b8499; --border: #e5e1ed; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; } body { background: var(--light); color: var(--text); } button, input { font-family: inherit; } /* ================= AUTH ================= */ .auth-page { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: radial-gradient( circle at top left, rgba(192,132,252,.35), transparent 35% ), linear-gradient( 135deg, #0f0b1a, #24113f, #5b21b6 ); } .auth-box { width: 400px; max-width: 100%; padding: 40px 35px; background: rgba(24,19,41,.96); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; box-shadow: 0 25px 70px rgba(0,0,0,.45); text-align: center; color: white; } .logo { color: var(--accent); font-size: 42px; font-weight: 800; margin-bottom: 7px; } .logo-subtitle { color: #a9a0b9; font-size: 14px; margin-bottom: 28px; } .auth-box h2 { margin-bottom: 20px; } .auth-box input { width: 100%; padding: 14px 16px; margin: 7px 0; border: 1px solid #392d52; border-radius: 12px; background: var(--dark-input); color: white; outline: none; font-size: 15px; } .auth-box input::placeholder { color: #8e849d; } .auth-box input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(168,85,247,.15); } .main-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 12px; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 25px rgba(124,58,237,.3); } .main-btn:hover { background: linear-gradient( 135deg, #6d28d9, #9333ea ); } .switch-btn { margin-top: 20px; border: none; background: none; color: var(--accent); cursor: pointer; font-size: 14px; } .switch-btn:hover { color: white; } .error { color: #ff7b7b; margin-top: 12px; font-size: 14px; } /* ================= APP ================= */ #app { display: none; height: 100vh; } .messenger { height: 100vh; display: flex; background: white; } /* ================= SIDEBAR ================= */ .sidebar { width: 330px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: white; } .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; } .sidebar-header h2 { font-size: 27px; color: var(--primary-dark); } .logout { border: none; background: #f1eef7; padding: 8px 12px; border-radius: 9px; cursor: pointer; } .logout:hover { background: #e5def0; } .profile-mini { padding: 8px 15px 18px; display: flex; align-items: center; cursor: pointer; } .profile-mini-name { font-weight: bold; } .profile-mini-email { color: var(--muted); font-size: 12px; margin-top: 3px; } /* ================= AVATAR ================= */ .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; background-size: cover; background-position: center; } /* ================= SEARCH ================= */ .search { width: calc(100% - 30px); margin: 0 15px 15px; padding: 12px 16px; border: none; background: #f3f1f7; border-radius: 20px; outline: none; } .search:focus { box-shadow: 0 0 0 2px rgba(124,58,237,.15); } /* ================= USERS ================= */ .users { overflow-y: auto; flex: 1; } .user { display: flex; align-items: center; padding: 12px 15px; cursor: pointer; } .user:hover { background: #f6f3fb; } .user.active { background: #eee7ff; } .user-info { min-width: 0; } .user-info strong { display: block; margin-bottom: 4px; } .user-info span { color: var(--muted); font-size: 13px; } /* ================= CHAT ================= */ .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--light); } .empty-chat { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; color: var(--muted); } .empty-chat h2 { color: var(--primary-dark); margin-bottom: 8px; } .chat-area { height: 100%; display: flex; flex-direction: column; } /* ================= CHAT HEADER ================= */ .chat-header { height: 75px; padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; background: white; } .chat-header .avatar { width: 42px; height: 42px; } .chat-header-info strong { display: block; } .chat-header-info span { color: var(--muted); font-size: 13px; } /* ================= MESSAGES ================= */ .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: radial-gradient( circle at 10% 10%, rgba(192,132,252,.08), transparent 25% ), var(--light); } .message { max-width: 65%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; line-height: 1.4; } .received { background: var(--received); color: var(--text); align-self: flex-start; border-bottom-left-radius: 5px; } .sent { background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; align-self: flex-end; border-bottom-right-radius: 5px; } .message-time { font-size: 10px; opacity: .65; margin-top: 3px; } /* ================= INPUT ================= */ .message-input { display: flex; padding: 15px; border-top: 1px solid var(--border); gap: 10px; background: white; } .message-input input { flex: 1; padding: 13px 16px; border: none; background: #f1eef7; border-radius: 22px; outline: none; font-size: 15px; } .message-input button { width: 45px; height: 45px; border: none; border-radius: 50%; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; cursor: pointer; font-size: 18px; } /* ================= PROFILE MODAL ================= */ .modal { display: none; position: fixed; inset: 0; background: rgba(15,11,26,.65); justify-content: center; align-items: center; z-index: 100; padding: 20px; } .modal-box { width: 380px; max-width: 100%; background: white; border-radius: 20px; padding: 25px; text-align: center; } .modal-box h2 { margin-bottom: 20px; color: var(--primary-dark); } .profile-large { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient( 135deg, var(--primary), var(--secondary) ); color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; font-weight: bold; background-size: cover; background-position: center; } .file-label { display: inline-block; background: var(--primary); color: white; padding: 10px 15px; border-radius: 9px; cursor: pointer; margin-bottom: 15px; } #profileFile { display: none; } .close-btn { border: none; background: #eeeaf3; padding: 10px 18px; border-radius: 8px; cursor: pointer; } /* ================= MOBILE ================= */ @media(max-width:700px) { .sidebar { width: 82px; } .sidebar-header h2, .search, .user-info, .logout, .profile-mini-name, .profile-mini-email { display: none; } .sidebar-header { justify-content: center; } .profile-mini { justify-content: center; } .user { justify-content: center; } .avatar { margin-right: 0; } .message { max-width: 80%; } } </style> </head> <body> <!-- ================= LOGIN ================= --> <div id="loginPage" class="auth-page"> <div class="auth-box"> <div class="logo">Comme</div> <div class="logo-subtitle"> Connect. Chat. Stay Comme. </div> <h2>Welcome Back</h2> <input type="email" id="loginEmail" placeholder="Email" > <input type="password" id="loginPassword" placeholder="Password" > <button class="main-btn" id="loginBtn"> Log In </button> <p id="loginError" class="error"></p> <button class="switch-btn" id="showRegisterBtn"> Create Account </button> </div> </div> <!-- ================= REGISTER ================= --> <div id="registerPage" class="auth-page" style="display:none;" > <div class="auth-box"> <div class="logo">Comme</div> <div class="logo-subtitle"> Join the conversation. </div> <h2>Create Account</h2> <input type="text" id="registerUsername" placeholder="Nickname" > <input type="email" id="registerEmail" placeholder="Email" > <input type="password" id="registerPassword" placeholder="Password" > <input type="password" id="confirmPassword" placeholder="Confirm password" > <button class="main-btn" id="registerBtn"> Create Account </button> <p id="registerError" class="error"></p> <button class="switch-btn" id="showLoginBtn"> Already have an account? Log In </button> </div> </div> <!-- ================= APP ================= --> <div id="app"> <div class="messenger"> <!-- SIDEBAR --> <div class="sidebar"> <div class="sidebar-header"> <h2>Comme</h2> <button class="logout" id="logoutBtn" > Logout </button> </div> <div class="profile-mini" id="profileButton" > <div class="avatar" id="myAvatar" ></div> <div> <div class="profile-mini-name" id="myUsername" ></div> <div class="profile-mini-email" id="myEmail" ></div> </div> </div> <input class="search" id="searchInput" placeholder="Search users..." > <div class="users" id="users" ></div> </div> <!-- CHAT --> <div class="chat"> <div id="emptyChat" class="empty-chat" > <div> <h2>Welcome to Comme</h2> <p> Select someone to start chatting. </p> </div> </div> <div id="chatArea" class="chat-area" style="display:none;" > <div class="chat-header"> <div class="avatar" id="chatAvatar" ></div> <div class="chat-header-info"> <strong id="chatName"></strong> <span>Messenger</span> </div> </div> <div class="messages" id="messages" ></div> <div class="message-input"> <input id="messageInput" placeholder="Type a message..." > <button id="sendBtn"> ➤ </button> </div> </div> </div> </div> </div> <!-- ================= PROFILE ================= --> <div class="modal" id="profileModal" > <div class="modal-box"> <h2>Your Profile</h2> <div id="profilePreview" class="profile-large" ></div> <label class="file-label" for="profileFile" > Choose Profile Picture </label> <input type="file" id="profileFile" accept="image/*" > <p id="profileStatus" style="margin-bottom:15px;color:#777;" ></p> <button class="close-btn" id="closeProfile" > Close </button> </div> </div> <!-- ================= FIREBASE ================= --> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js"; import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js"; import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"; import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js"; /* ========================= FIREBASE CONFIG ========================= */ const firebaseConfig = { apiKey: "AIzaSyClvmIluOTr96EgH1WPAaQNC_1IMXcshQE", authDomain: "comtine-436b6.firebaseapp.com", projectId: "comtine-436b6", storageBucket: "comtine-436b6.firebasestorage.app", messagingSenderId: "54469012189", appId: "1:54469012189:web:23592f94aa26bdc5e30934" }; /* ========================= INITIALIZE FIREBASE ========================= */ const firebaseApp = initializeApp(firebaseConfig); const auth = getAuth(firebaseApp); const db = getFirestore(firebaseApp); const storage = getStorage(firebaseApp); /* ========================= VARIABLES ========================= */ let currentUser = null; let currentProfile = null; let selectedUser = null; let unsubscribeMessages = null; /* ========================= ELEMENTS ========================= */ const loginPage = document.getElementById("loginPage"); const registerPage = document.getElementById("registerPage"); const appPage = document.getElementById("app"); const loginError = document.getElementById("loginError"); const registerError = document.getElementById("registerError"); const usersDiv = document.getElementById("users"); const messagesDiv = document.getElementById("messages"); /* ========================= LOGIN / REGISTER SWITCH ========================= */ document .getElementById("showRegisterBtn") .onclick = () => { loginPage.style.display = "none"; registerPage.style.display = "flex"; }; document .getElementById("showLoginBtn") .onclick = () => { registerPage.style.display = "none"; loginPage.style.display = "flex"; }; /* ========================= CREATE ACCOUNT ========================= */ document .getElementById("registerBtn") .onclick = async () => { registerError.textContent = ""; const username = document .getElementById("registerUsername") .value .trim(); const email = document .getElementById("registerEmail") .value .trim(); const password = document .getElementById("registerPassword") .value; const confirm = document .getElementById("confirmPassword") .value; if (!username || !email || !password || !confirm) { registerError.textContent = "Please fill in all fields."; return; } if (username.length < 3) { registerError.textContent = "Nickname must be at least 3 characters."; return; } if (password.length < 6) { registerError.textContent = "Password must be at least 6 characters."; return; } if (password !== confirm) { registerError.textContent = "Passwords do not match."; return; } try { const result = await createUserWithEmailAndPassword( auth, email, password ); const user = result.user; await setDoc( doc(db, "users", user.uid), { uid: user.uid, username: username, usernameLower: username.toLowerCase(), email: email, photoURL: "", createdAt: serverTimestamp() } ); alert( "Account created successfully!" ); } catch (error) { console.error(error); registerError.textContent = firebaseError(error.code); } }; /* ========================= LOGIN ========================= */ document .getElementById("loginBtn") .onclick = async () => { loginError.textContent = ""; const email = document .getElementById("loginEmail") .value .trim(); const password = document .getElementById("loginPassword") .value; if (!email || !password) { loginError.textContent = "Enter your email and password."; return; } try { await signInWithEmailAndPassword( auth, email, password ); } catch (error) { console.error(error); loginError.textContent = firebaseError(error.code); } }; /* ========================= AUTH STATE ========================= */ onAuthStateChanged( auth, async user => { if (user) { currentUser = user; await loadProfile(); loginPage.style.display = "none"; registerPage.style.display = "none"; appPage.style.display = "block"; await loadUsers(); } else { currentUser = null; currentProfile = null; selectedUser = null; appPage.style.display = "none"; loginPage.style.display = "flex"; } } ); /* ========================= LOAD PROFILE ========================= */ async function loadProfile() { const profileRef = doc(db, "users", currentUser.uid); const snapshot = await getDoc(profileRef); if (!snapshot.exists()) { console.error( "User profile not found." ); return; } currentProfile = snapshot.data(); document .getElementById("myUsername") .textContent = currentProfile.username; document .getElementById("myEmail") .textContent = currentProfile.email; setAvatar( document.getElementById("myAvatar"), currentProfile ); setAvatar( document.getElementById("profilePreview"), currentProfile ); } /* ========================= AVATAR ========================= */ function setAvatar(element, user) { element.style.backgroundImage = "none"; if (user.photoURL) { element.style.backgroundImage = `url("${user.photoURL}")`; element.textContent = ""; } else { element.textContent = user.username .charAt(0) .toUpperCase(); } } /* ========================= LOAD USERS ========================= */ async function loadUsers() { usersDiv.innerHTML = ""; try { const snapshot = await getDocs( collection(db, "users") ); snapshot.forEach(item => { const user = item.data(); if ( currentUser && user.uid === currentUser.uid ) { return; } createUserElement(user); }); } catch (error) { console.error( "Could not load users:", error ); } } /* ========================= USER ELEMENT ========================= */ function createUserElement(user) { const div = document.createElement("div"); div.className = "user"; div.dataset.username = user.usernameLower; const avatar = document.createElement("div"); avatar.className = "avatar"; setAvatar(avatar, user); const info = document.createElement("div"); info.className = "user-info"; const name = document.createElement("strong"); name.textContent = user.username; const status = document.createElement("span"); status.textContent = "Message"; info.appendChild(name); info.appendChild(status); div.appendChild(avatar); div.appendChild(info); div.onclick = () => { document .querySelectorAll(".user") .forEach(item => item.classList.remove("active") ); div.classList.add("active"); openChat(user); }; usersDiv.appendChild(div); } /* ========================= SEARCH ========================= */ document .getElementById("searchInput") .addEventListener( "input", event => { const search = event.target.value .toLowerCase() .trim(); document .querySelectorAll(".user") .forEach(user => { const username = user.dataset.username; user.style.display = username.includes(search) ? "flex" : "none"; }); } ); /* ========================= OPEN CHAT ========================= */ function openChat(user) { selectedUser = user; document .getElementById("emptyChat") .style.display = "none"; document .getElementById("chatArea") .style.display = "flex"; document .getElementById("chatName") .textContent = user.username; setAvatar( document.getElementById("chatAvatar"), user ); loadMessages(); } /* ========================= CHAT ID ========================= */ function getChatId() { const ids = [ currentUser.uid, selectedUser.uid ]; ids.sort(); return ids.join("_"); } /* ========================= LOAD MESSAGES ========================= */ function loadMessages() { if (unsubscribeMessages) { unsubscribeMessages(); } messagesDiv.innerHTML = ""; const chatId = getChatId(); const messagesRef = collection( db, "chats", chatId, "messages" ); const messagesQuery = query( messagesRef, orderBy("createdAt", "asc") ); unsubscribeMessages = onSnapshot( messagesQuery, snapshot => { messagesDiv.innerHTML = ""; snapshot.forEach(item => { displayMessage( item.data() ); }); messagesDiv.scrollTop = messagesDiv.scrollHeight; }, error => { console.error( "Message listener error:", error ); } ); } /* ========================= DISPLAY MESSAGE ========================= */ function displayMessage(message) { const wrapper = document.createElement("div"); wrapper.className = message.senderId === currentUser.uid ? "message sent" : "message received"; const text = document.createElement("div"); text.textContent = message.text; wrapper.appendChild(text); if (message.createdAt) { const time = document.createElement("div"); time.className = "message-time"; time.textContent = message.createdAt .toDate() .toLocaleTimeString( [], { hour: "2-digit", minute: "2-digit" } ); wrapper.appendChild(time); } messagesDiv.appendChild(wrapper); } /* ========================= SEND MESSAGE ========================= */ document .getElementById("sendBtn") .onclick = sendMessage; document .getElementById("messageInput") .addEventListener( "keydown", event => { if (event.key === "Enter") { sendMessage(); } } ); async function sendMessage() { if (!selectedUser) { return; } const input = document.getElementById( "messageInput" ); const text = input.value.trim(); if (!text) { return; } const chatId = getChatId(); try { await addDoc( collection( db, "chats", chatId, "messages" ), { text: text, senderId: currentUser.uid, receiverId: selectedUser.uid, createdAt: serverTimestamp() } ); input.value = ""; } catch (error) { console.error(error); alert( "Message could not be sent." ); } } /* ========================= PROFILE MODAL ========================= */ document .getElementById("profileButton") .onclick = () => { document .getElementById("profileModal") .style.display = "flex"; }; document .getElementById("closeProfile") .onclick = () => { document .getElementById("profileModal") .style.display = "none"; }; /* ========================= PROFILE PICTURE ========================= */ document .getElementById("profileFile") .addEventListener( "change", async event => { const file = event.target.files[0]; if (!file) { return; } if (!file.type.startsWith("image/")) { alert( "Please choose an image." ); return; } if ( file.size > 5 * 1024 * 1024 ) { alert( "Image must be smaller than 5 MB." ); return; } const status = document.getElementById( "profileStatus" ); status.textContent = "Uploading..."; try { const fileName = Date.now() + "_" + file.name; const imageRef = ref( storage, "profilePictures/" + currentUser.uid + "/" + fileName ); await uploadBytes( imageRef, file ); const url = await getDownloadURL( imageRef ); await setDoc( doc( db, "users", currentUser.uid ), { photoURL: url }, { merge: true } ); currentProfile.photoURL = url; setAvatar( document.getElementById( "myAvatar" ), currentProfile ); setAvatar( document.getElementById( "profilePreview" ), currentProfile ); status.textContent = "Profile picture updated!"; await loadUsers(); } catch (error) { console.error(error); status.textContent = "Upload failed."; } } ); /* ========================= LOGOUT ========================= */ document .getElementById("logoutBtn") .onclick = async () => { if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; } await signOut(auth); }; /* ========================= FIREBASE ERRORS ========================= */ function firebaseError(code) { switch (code) { case "auth/email-already-in-use": return "That email is already registered."; case "auth/invalid-email": return "Please enter a valid email."; case "auth/weak-password": return "Password must be at least 6 characters."; case "auth/invalid-credential": return "Incorrect email or password."; case "auth/user-not-found": return "Account not found."; case "auth/wrong-password": return "Incorrect password."; case "auth/too-many-requests": return "Too many attempts. Please try again later."; case "auth/network-request-failed": return "Network error. Check your internet connection."; default: return "Something went wrong. Please try again."; } } </script> </body> </html>
