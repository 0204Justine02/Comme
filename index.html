<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Comme Messenger</title> <style> *{ box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; } body{ background:#0f1220; color:#fff; } /* AUTH */ .auth-page{ min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; background: radial-gradient(circle at 10% 10%,#7c3aed,transparent 35%), radial-gradient(circle at 90% 90%,#06b6d4,transparent 35%), #0f1220; } .auth-box{ width:400px; max-width:100%; padding:35px; background:#171b2b; border:1px solid #30364d; border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,.45); text-align:center; } .logo{ font-size:42px; font-weight:800; margin-bottom:8px; background:linear-gradient(90deg,#a78bfa,#22d3ee); -webkit-background-clip:text; color:transparent; } .auth-subtitle{ color:#9ca3af; margin-bottom:25px; } .auth-box h2{ margin-bottom:18px; } .auth-box input{ width:100%; padding:14px; margin:7px 0; border:1px solid #343b55; border-radius:10px; background:#101421; color:white; outline:none; } .auth-box input:focus{ border-color:#8b5cf6; } .main-btn{ width:100%; padding:14px; margin-top:12px; border:0; border-radius:10px; background:linear-gradient(90deg,#7c3aed,#0891b2); color:white; font-weight:bold; font-size:16px; cursor:pointer; } .main-btn:hover{ opacity:.9; } .switch-btn{ margin-top:18px; border:0; background:none; color:#22d3ee; cursor:pointer; } .error{ min-height:20px; color:#fb7185; margin-top:12px; font-size:14px; } /* APP */ #app{ display:none; height:100vh; } .messenger{ height:100vh; display:flex; background:#111522; } /* SIDEBAR */ .sidebar{ width:330px; border-right:1px solid #2b3145; display:flex; flex-direction:column; background:#151927; } .sidebar-header{ padding:18px; display:flex; align-items:center; justify-content:space-between; } .sidebar-header h2{ color:#c4b5fd; } .logout{ border:0; padding:8px 12px; border-radius:8px; background:#252b3e; color:#fff; cursor:pointer; } .profile-mini{ padding:10px 15px 18px; display:flex; align-items:center; cursor:pointer; } .profile-mini:hover{ background:#1d2232; } .avatar{ width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#06b6d4); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; flex-shrink:0; background-size:cover; background-position:center; } .profile-mini .avatar{ margin-right:12px; } .profile-mini-name{ font-weight:bold; } .profile-mini-email{ color:#8f96aa; font-size:12px; margin-top:3px; } .search{ width:calc(100% - 30px); margin:0 15px 10px; padding:12px 15px; border:0; border-radius:20px; outline:none; background:#242a3b; color:white; } .sidebar-buttons{ display:flex; gap:8px; padding:5px 15px 12px; } .side-btn{ flex:1; border:0; padding:10px 5px; border-radius:9px; background:#252b3e; color:#ddd; cursor:pointer; } .side-btn:hover{ background:#343b55; } .users{ flex:1; overflow-y:auto; } .user{ display:flex; align-items:center; padding:12px 15px; cursor:pointer; } .user:hover{ background:#202638; } .user.active{ background:#292344; } .user .avatar{ margin-right:12px; } .user-info{ min-width:0; } .user-info strong{ display:block; margin-bottom:4px; } .user-info span{ color:#8f96aa; font-size:13px; } /* CHAT */ .chat{ flex:1; min-width:0; display:flex; flex-direction:column; } .empty-chat{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; color:#858ca0; } .empty-chat h2{ color:#c4b5fd; margin-bottom:10px; } .chat-area{ height:100%; display:flex; flex-direction:column; } .chat-header{ height:75px; padding:15px 20px; border-bottom:1px solid #2b3145; display:flex; align-items:center; background:#151927; } .chat-header .avatar{ width:42px; height:42px; margin-right:12px; } .chat-header-info strong{ display:block; } .chat-header-info span{ color:#8f96aa; font-size:13px; } .messages{ flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; } .message{ max-width:65%; padding:10px 14px; border-radius:18px; word-wrap:break-word; line-height:1.4; } .received{ background:#292f40; align-self:flex-start; } .sent{ background:linear-gradient(135deg,#7c3aed,#0891b2); align-self:flex-end; } .message-time{ font-size:10px; opacity:.65; margin-top:3px; } .message-input{ display:flex; padding:15px; border-top:1px solid #2b3145; gap:10px; background:#151927; } .message-input input{ flex:1; padding:13px 16px; border:0; border-radius:22px; outline:none; background:#242a3b; color:white; } .message-input button{ width:45px; height:45px; border:0; border-radius:50%; background:#7c3aed; color:white; cursor:pointer; } /* MODAL */ .modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); justify-content:center; align-items:center; z-index:100; padding:20px; } .modal-box{ width:400px; max-width:100%; background:#171b2b; border:1px solid #30364d; border-radius:18px; padding:25px; } .modal-box h2{ margin-bottom:20px; } .modal-box input{ width:100%; padding:12px; margin:7px 0; border:1px solid #343b55; background:#101421; color:white; border-radius:9px; outline:none; } .profile-large{ width:110px; height:110px; margin:0 auto 15px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#06b6d4); display:flex; justify-content:center; align-items:center; font-size:40px; font-weight:bold; background-size:cover; background-position:center; } .file-label{ display:block; text-align:center; background:#252b3e; padding:10px; border-radius:9px; cursor:pointer; margin-bottom:12px; } #profileFile{ display:none; } .modal-actions{ display:flex; gap:10px; margin-top:12px; } .modal-actions button{ flex:1; } .secondary-btn{ padding:12px; border:0; border-radius:9px; background:#292f40; color:white; cursor:pointer; } .friend-status{ font-size:11px; color:#22d3ee; } /* MOBILE */ @media(max-width:700px){ .sidebar{ width:85px; } .sidebar-header h2, .logout, .profile-mini-name, .profile-mini-email, .search, .user-info{ display:none; } .sidebar-header{ justify-content:center; } .profile-mini{ justify-content:center; } .profile-mini .avatar{ margin-right:0; } .user{ justify-content:center; } .user .avatar{ margin-right:0; } .sidebar-buttons{ flex-direction:column; padding:5px 10px; } .side-btn{ font-size:11px; } .message{ max-width:82%; } } </style> </head> <body> <!-- LOGIN --> <div id="loginPage" class="auth-page"> <div class="auth-box"> <div class="logo">Comme</div> <div class="auth-subtitle"> Connect with your friends </div> <h2>Log In</h2> <input type="email" id="loginEmail" placeholder="Email" > <input type="password" id="loginPassword" placeholder="Password" > <button class="main-btn" id="loginBtn"> Log In </button> <p class="error" id="loginError"></p> <button class="switch-btn" id="showRegisterBtn"> Create Account </button> </div> </div> <!-- REGISTER --> <div id="registerPage" class="auth-page" style="display:none;"> <div class="auth-box"> <div class="logo">Comme</div> <div class="auth-subtitle"> Create your account </div> <h2>Create Account</h2> <input type="text" id="registerUsername" placeholder="Nickname" > <input type="email" id="registerEmail" placeholder="Email" > <input type="password" id="registerPassword" placeholder="Password" > <input type="password" id="confirmPassword" placeholder="Confirm Password" > <button class="main-btn" id="registerBtn"> Create Account </button> <p class="error" id="registerError"></p> <button class="switch-btn" id="showLoginBtn"> Already have an account? Log In </button> </div> </div> <!-- APP --> <div id="app"> <div class="messenger"> <!-- SIDEBAR --> <div class="sidebar"> <div class="sidebar-header"> <h2>Chats</h2> <button class="logout" id="logoutBtn"> Logout </button> </div> <div class="profile-mini" id="profileButton"> <div class="avatar" id="myAvatar"></div> <div> <div class="profile-mini-name" id="myUsername"> </div> <div class="profile-mini-email" id="myEmail"> </div> </div> </div> <input class="search" id="searchInput" placeholder="Search users..." > <div class="sidebar-buttons"> <button class="side-btn" id="allUsersBtn"> Users </button> <button class="side-btn" id="friendsBtn"> Friends </button> </div> <div class="users" id="users"></div> </div> <!-- CHAT --> <div class="chat"> <div id="emptyChat" class="empty-chat"> <div> <h2>Comme Messenger</h2> <p> Select a friend to start chatting. </p> </div> </div> <div id="chatArea" class="chat-area" style="display:none;" > <div class="chat-header"> <div class="avatar" id="chatAvatar"> </div> <div class="chat-header-info"> <strong id="chatName"></strong> <span>Comme Messenger</span> </div> </div> <div class="messages" id="messages"> </div> <div class="message-input"> <input id="messageInput" placeholder="Type a message..." > <button id="sendBtn"> ➤ </button> </div> </div> </div> </div> </div> <!-- PROFILE MODAL --> <div class="modal" id="profileModal"> <div class="modal-box"> <h2>Edit Profile</h2> <div id="profilePreview" class="profile-large"> </div> <label class="file-label" for="profileFile"> Choose Profile Picture </label> <input type="file" id="profileFile" accept="image/*" > <input id="editUsername" type="text" placeholder="Nickname" > <p id="profileStatus" style="color:#8f96aa;margin-top:8px;"> </p> <div class="modal-actions"> <button class="main-btn" id="saveProfileBtn"> Save </button> <button class="secondary-btn" id="closeProfile"> Close </button> </div> </div> </div> <script type="module"> /* ========================================================= FIREBASE IMPORTS ========================================================= */ import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js"; import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js"; import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, query, orderBy, onSnapshot, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"; /* ========================================================= FIREBASE CONFIG ========================================================= */ const firebaseConfig = { apiKey: "AIzaSyClvmIluOTr96EgH1WPAaQNC_1IMXcshQE", authDomain: "comtine-436b6.firebaseapp.com", projectId: "comtine-436b6", storageBucket: "comtine-436b6.firebasestorage.app", messagingSenderId: "54469012189", appId: "1:54469012189:web:23592f94aa26bdc5e30934", measurementId: "G-HF4B8E429E" }; /* ========================================================= INITIALIZE ========================================================= */ const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); /* ========================================================= VARIABLES ========================================================= */ let currentUser = null; let currentProfile = null; let selectedUser = null; let unsubscribeMessages = null; let allUsers = []; let showingFriends = false; /* ========================================================= ELEMENTS ========================================================= */ const loginPage = document.getElementById("loginPage"); const registerPage = document.getElementById("registerPage"); const appPage = document.getElementById("app"); const usersDiv = document.getElementById("users"); const messagesDiv = document.getElementById("messages"); /* ========================================================= PAGE SWITCHING ========================================================= */ document .getElementById("showRegisterBtn") .onclick = () => { loginPage.style.display = "none"; registerPage.style.display = "flex"; }; document .getElementById("showLoginBtn") .onclick = () => { registerPage.style.display = "none"; loginPage.style.display = "flex"; }; /* ========================================================= REGISTER ========================================================= */ document .getElementById("registerBtn") .onclick = async () => { const errorBox = document.getElementById("registerError"); errorBox.textContent = ""; const username = document .getElementById("registerUsername") .value .trim(); const email = document .getElementById("registerEmail") .value .trim(); const password = document .getElementById("registerPassword") .value; const confirm = document .getElementById("confirmPassword") .value; if (!username || !email || !password || !confirm) { errorBox.textContent = "Please fill in all fields."; return; } if (username.length < 3) { errorBox.textContent = "Nickname must be at least 3 characters."; return; } if (password.length < 6) { errorBox.textContent = "Password must be at least 6 characters."; return; } if (password !== confirm) { errorBox.textContent = "Passwords do not match."; return; } try { const result = await createUserWithEmailAndPassword( auth, email, password ); const user = result.user; await setDoc( doc(db, "users", user.uid), { uid: user.uid, username: username, usernameLower: username.toLowerCase(), email: email, photoURL: "", friends: [], createdAt: serverTimestamp() } ); alert("Account created successfully!"); } catch (error) { console.error(error); errorBox.textContent = firebaseError(error.code); } }; /* ========================================================= LOGIN ========================================================= */ document .getElementById("loginBtn") .onclick = async () => { const errorBox = document.getElementById("loginError"); errorBox.textContent = ""; const email = document .getElementById("loginEmail") .value .trim(); const password = document .getElementById("loginPassword") .value; if (!email || !password) { errorBox.textContent = "Enter your email and password."; return; } try { await signInWithEmailAndPassword( auth, email, password ); } catch (error) { console.error(error); errorBox.textContent = firebaseError(error.code); } }; /* ========================================================= AUTH STATE ========================================================= */ onAuthStateChanged(auth, async user => { if (user) { currentUser = user; await loadProfile(); loginPage.style.display = "none"; registerPage.style.display = "none"; appPage.style.display = "block"; await loadUsers(); } else { currentUser = null; currentProfile = null; selectedUser = null; appPage.style.display = "none"; loginPage.style.display = "flex"; } }); /* ========================================================= LOAD PROFILE ========================================================= */ async function loadProfile() { const snap = await getDoc( doc(db, "users", currentUser.uid) ); if (!snap.exists()) { console.error("Profile not found."); return; } currentProfile = snap.data(); document .getElementById("myUsername") .textContent = currentProfile.username; document .getElementById("myEmail") .textContent = currentProfile.email; document .getElementById("editUsername") .value = currentProfile.username; setAvatar( document.getElementById("myAvatar"), currentProfile ); setAvatar( document.getElementById("profilePreview"), currentProfile ); } /* ========================================================= AVATAR ========================================================= */ function setAvatar(element, user) { element.style.backgroundImage = "none"; if (user.photoURL) { element.style.backgroundImage = `url("${user.photoURL}")`; element.textContent = ""; } else { element.textContent = (user.username || "?") .charAt(0) .toUpperCase(); } } /* ========================================================= LOAD USERS ========================================================= */ async function loadUsers() { try { const snapshot = await getDocs( collection(db, "users") ); allUsers = []; snapshot.forEach(item => { const user = item.data(); if ( currentUser && user.uid !== currentUser.uid ) { allUsers.push(user); } }); renderUsers(); } catch (error) { console.error( "Could not load users:", error ); } } /* ========================================================= RENDER USERS ========================================================= */ function renderUsers() { usersDiv.innerHTML = ""; const search = document .getElementById("searchInput") .value .toLowerCase() .trim(); let list = allUsers; if (showingFriends) { const friends = currentProfile?.friends || []; list = allUsers.filter(user => friends.includes(user.uid) ); } list = list.filter(user => user.usernameLower .includes(search) ); if (list.length === 0) { usersDiv.innerHTML = ` <div style=" padding:25px; text-align:center; color:#777; "> ${showingFriends ? "No friends yet." : "No users found."} </div> `; return; } list.forEach(user => createUserElement(user) ); } /* ========================================================= USER ELEMENT ========================================================= */ function createUserElement(user) { const div = document.createElement("div"); div.className = "user"; const avatar = document.createElement("div"); avatar.className = "avatar"; setAvatar(avatar, user); const info = document.createElement("div"); info.className = "user-info"; const name = document.createElement("strong"); name.textContent = user.username; const status = document.createElement("span"); const isFriend = (currentProfile?.friends || []) .includes(user.uid); status.innerHTML = isFriend ? `<span class="friend-status">Friend</span>` : "Not added"; info.appendChild(name); info.appendChild(status); div.appendChild(avatar); div.appendChild(info); div.onclick = () => { document .querySelectorAll(".user") .forEach(item => item.classList.remove("active") ); div.classList.add("active"); openChat(user); }; usersDiv.appendChild(div); } /* ========================================================= SEARCH ========================================================= */ document .getElementById("searchInput") .addEventListener( "input", renderUsers ); /* ========================================================= USERS / FRIENDS BUTTONS ========================================================= */ document .getElementById("allUsersBtn") .onclick = () => { showingFriends = false; renderUsers(); }; document .getElementById("friendsBtn") .onclick = () => { showingFriends = true; renderUsers(); }; /* ========================================================= OPEN CHAT ========================================================= */ function openChat(user) { selectedUser = user; document .getElementById("emptyChat") .style.display = "none"; document .getElementById("chatArea") .style.display = "flex"; document .getElementById("chatName") .textContent = user.username; setAvatar( document.getElementById("chatAvatar"), user ); loadMessages(); } /* ========================================================= CHAT ID ========================================================= */ function getChatId() { const ids = [ currentUser.uid, selectedUser.uid ]; ids.sort(); return ids.join("_"); } /* ========================================================= LOAD MESSAGES ========================================================= */ function loadMessages() { if (unsubscribeMessages) { unsubscribeMessages(); } messagesDiv.innerHTML = ""; const chatId = getChatId(); const messagesRef = collection( db, "chats", chatId, "messages" ); const messagesQuery = query( messagesRef, orderBy("createdAt", "asc") ); unsubscribeMessages = onSnapshot( messagesQuery, snapshot => { messagesDiv.innerHTML = ""; snapshot.forEach(item => { displayMessage( item.data() ); }); messagesDiv.scrollTop = messagesDiv.scrollHeight; }, error => { console.error( "Message listener error:", error ); } ); } /* ========================================================= DISPLAY MESSAGE ========================================================= */ function displayMessage(message) { const wrapper = document.createElement("div"); wrapper.className = message.senderId === currentUser.uid ? "message sent" : "message received"; const text = document.createElement("div"); text.textContent = message.text; wrapper.appendChild(text); if (message.createdAt) { const time = document.createElement("div"); time.className = "message-time"; time.textContent = message.createdAt .toDate() .toLocaleTimeString( [], { hour:"2-digit", minute:"2-digit" } ); wrapper.appendChild(time); } messagesDiv.appendChild(wrapper); } /* ========================================================= SEND MESSAGE ========================================================= */ document .getElementById("sendBtn") .onclick = sendMessage; document .getElementById("messageInput") .addEventListener( "keydown", event => { if (event.key === "Enter") { event.preventDefault(); sendMessage(); } } ); async function sendMessage() { if (!selectedUser) { alert( "Select a user first." ); return; } const input = document.getElementById( "messageInput" ); const text = input.value.trim(); if (!text) return; const chatId = getChatId(); try { await addDoc( collection( db, "chats", chatId, "messages" ), { text: text, senderId: currentUser.uid, receiverId: selectedUser.uid, createdAt: serverTimestamp() } ); input.value = ""; } catch (error) { console.error(error); alert( "Message could not be sent." ); } } /* ========================================================= ADD FRIEND Double-click a user to add/remove friend ========================================================= */ usersDiv.addEventListener( "dblclick", async event => { const userElement = event.target.closest(".user"); if (!userElement) return; const index = [...usersDiv.children] .indexOf(userElement); const visibleUsers = showingFriends ? allUsers.filter(user => (currentProfile?.friends || []) .includes(user.uid) ) : allUsers; const search = document .getElementById("searchInput") .value .toLowerCase() .trim(); const filtered = visibleUsers.filter(user => user.usernameLower .includes(search) ); const user = filtered[index]; if (!user) return; await toggleFriend(user); } ); /* ========================================================= FRIEND FUNCTION ========================================================= */ async function toggleFriend(user) { const friends = currentProfile.friends || []; const alreadyFriend = friends.includes(user.uid); try { if (alreadyFriend) { await updateDoc( doc( db, "users", currentUser.uid ), { friends: arrayRemove(user.uid) } ); } else { await updateDoc( doc( db, "users", currentUser.uid ), { friends: arrayUnion(user.uid) } ); } await loadProfile(); await loadUsers(); alert( alreadyFriend ? "Friend removed." : "Friend added." ); } catch (error) { console.error(error); alert( "Could not update friend list." ); } } /* ========================================================= PROFILE MODAL ========================================================= */ document .getElementById("profileButton") .onclick = () => { document .getElementById("editUsername") .value = currentProfile.username; document .getElementById("profileModal") .style.display = "flex"; }; document .getElementById("closeProfile") .onclick = () => { document .getElementById("profileModal") .style.display = "none"; }; /* ========================================================= PROFILE IMAGE No Firebase Storage required ========================================================= */ document .getElementById("profileFile") .addEventListener( "change", event => { const file = event.target.files[0]; if (!file) return; if (!file.type.startsWith("image/")) { alert( "Please choose an image." ); return; } if (file.size > 2 * 1024 * 1024) { alert( "Please choose an image smaller than 2 MB." ); return; } const reader = new FileReader(); reader.onload = () => { compressImage( reader.result, async compressed => { currentProfile.photoURL = compressed; setAvatar( document.getElementById( "profilePreview" ), currentProfile ); document .getElementById( "profileStatus" ) .textContent = "Picture selected. Click Save."; } ); }; reader.readAsDataURL(file); } ); /* ========================================================= IMAGE COMPRESSION ========================================================= */ function compressImage( source, callback ) { const image = new Image(); image.onload = () => { const canvas = document.createElement("canvas"); const maxSize = 400; let width = image.width; let height = image.height; if (width > height) { if (width > maxSize) { height = height * maxSize / width; width = maxSize; } } else { if (height > maxSize) { width = width * maxSize / height; height = maxSize; } } canvas.width = width; canvas.height = height; const ctx = canvas.getContext("2d"); ctx.drawImage( image, 0, 0, width, height ); callback( canvas.toDataURL( "image/jpeg", .75 ) ); }; image.src = source; } /* ========================================================= SAVE PROFILE ========================================================= */ document .getElementById("saveProfileBtn") .onclick = async () => { const username = document .getElementById("editUsername") .value .trim(); const status = document.getElementById( "profileStatus" ); if (username.length < 3) { status.textContent = "Nickname must be at least 3 characters."; return; } try { await updateDoc( doc( db, "users", currentUser.uid ), { username: username, usernameLower: username.toLowerCase(), photoURL: currentProfile.photoURL || "" } ); await loadProfile(); await loadUsers(); status.textContent = "Profile updated successfully!"; } catch (error) { console.error(error); status.textContent = "Could not update profile."; } }; /* ========================================================= LOGOUT ========================================================= */ document .getElementById("logoutBtn") .onclick = async () => { if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; } await signOut(auth); }; /* ========================================================= FIREBASE ERRORS ========================================================= */ function firebaseError(code) { switch (code) { case "auth/email-already-in-use": return "That email is already registered."; case "auth/invalid-email": return "Please enter a valid email."; case "auth/weak-password": return "Password must be at least 6 characters."; case "auth/invalid-credential": return "Incorrect email or password."; case "auth/user-not-found": return "Account not found."; case "auth/wrong-password": return "Incorrect password."; case "auth/network-request-failed": return "Network error. Check your internet."; default: return ( "Something went wrong: " + code ); } } </script> </body> </html>
